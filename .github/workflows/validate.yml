name: Reproduction checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.24"
      - name: Check frozen reference data
        run: python3 scripts/verify_results.py
      - name: Install locked CPU environment
        run: uv sync --locked
      - name: Test public entry points and released weights
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Test simulator correctness (CUDA tests skip on CPU)
        run: uv run --locked python -m unittest gpu_extension.test_study -v
      - name: Recompute reference analyses
        run: |
          uv run --locked python scripts/analyze_navigation.py
          uv run --locked python scripts/analyze_pusht.py
          uv run --locked python scripts/analyze_gpu.py --check-reference
